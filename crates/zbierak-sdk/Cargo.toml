[package]
name = "zbierak-sdk"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Runtime-independent Rust SDK for Zbierak"

[features]
default = ["blocking"]
# Synchronous client backed by an OS sender thread.
blocking = ["reqwest/blocking"]
# Asynchronous client backed by a spawned Tokio task.
async = ["dep:tokio"]

[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", optional = true, default-features = false, features = ["macros", "rt", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1", features = ["v4"] }
zbierak-protocol = { path = "../zbierak-protocol" }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
