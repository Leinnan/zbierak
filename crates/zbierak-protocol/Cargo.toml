[package]
name = "zbierak-protocol"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Wire types shared by Zbierak servers and clients"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
utoipa = { version = "6.0.0", optional = true }

[lints.rust]
unsafe_code = "forbid"

[features]
schema = ["dep:utoipa"]
