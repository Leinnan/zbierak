[package]
name = "zbierak"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A self-hosted error and crash collection service"

[workspace]
resolver = "3"
members = ["crates/*"]

[dependencies]
ammonia = "4.2.0"
argon2 = "0.6"
axum = { version = "0.8", features = ["form", "json", "multipart"] }
base64 = "0.23"
blake3 = "1"
chacha20poly1305 = "0.11.0"
dotenvy = "0.15"
hmac = "0.13"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
pulldown-cmark = "0.13.4"
rand = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite", "migrate"] }
subtle = "2.6"
tera = { version = "2", features = ["glob_fs"] }
thiserror = "2"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "fs"] }
tower-cookies = "0.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
utoipa = { version = "6.0.0", features = ["axum_extras", "time", "uuid"], optional = true }
utoipa-scalar = { version = "0.4.0", features = ["axum"], optional = true }
uuid = { version = "1", features = ["v4"] }
zbierak-protocol = { path = "crates/zbierak-protocol" }

[dev-dependencies]
http-body-util = "0.1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
tower = { version = "0.5", features = ["util"] }

# Workspace-wide lint policy, inherited by every member through
# `[lints] workspace = true`. Panics are denied in production code; test
# modules carry narrowly scoped allowances.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[lints]
workspace = true

[features]
docs = ["dep:utoipa", "dep:utoipa-scalar", "zbierak-protocol/schema"]
